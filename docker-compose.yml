services:
  mysql:
    image: mysql:8.4
    container_name: miscalorias-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: miscalorias
      MYSQL_USER: mis_calorias
      MYSQL_PASSWORD: mis_calorias
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    image: miscalorias-backend:local
    container_name: miscalorias-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Inside the compose network MySQL is reachable as "mysql", not localhost.
      DB_HOST: mysql
      DB_PORT: "3306"
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: miscalorias-frontend:local
    container_name: miscalorias-frontend
    restart: unless-stopped
    ports:
      # Open the app at http://localhost:8080
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
