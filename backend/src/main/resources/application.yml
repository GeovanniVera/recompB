spring:
  application:
    name: misCalorias
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:miscalorias}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:mis_calorias}
    password: ${DB_PASSWORD:mis_calorias}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  # 8080 is commonly taken on this machine, so the API defaults to 8081.
  port: ${SERVER_PORT:8081}
  error:
    include-message: never

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-change-me-this-secret-has-more-than-32-bytes}
    ttl: 12h
    issuer: misCalorias
  otp:
    ttl: 5m
    max-attempts: 5
    resend-cooldown: 30s
    code-length: 6
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:4200,http://127.0.0.1:4200}
  time:
    zone: ${APP_TIMEZONE:America/Mexico_City}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:true}
    tmb-check-cron: "0 30 20 * * *"
    checkin-reminder-cron: "0 0 8 * * *"
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    default-chat-id: ${TELEGRAM_CHAT_ID:}
    fallback-to-log: ${TELEGRAM_FALLBACK_TO_LOG:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
