<!doctype html>
<html lang="es" data-theme="graphite">
<head>
  <meta charset="utf-8">
  <title>Recomp3B</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141615">
  <meta name="description" content="Recomp3B · recomposición corporal y control nutricional con báscula">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Recomp3B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // Applied before the first paint so the stored theme never flashes the default.
    (function () {
      try {
        var stored = localStorage.getItem('recomp3b.theme');
        document.documentElement.setAttribute(
          'data-theme',
          stored === 'spruce' ? 'spruce' : 'graphite',
        );
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'graphite');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
